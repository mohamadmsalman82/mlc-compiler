name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only. Triton is not needed: the suite covers the
          # frontend, every pass, memory planning and the generated source,
          # and runs the kernel IR through the torch reference backend.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy

      - name: Test
        run: python -m pytest tests/ -q

      - name: Compile the benchmark models and check the generated Triton parses
        run: |
          python -m mlc passes bert-base --batch 1 --seq 128
          python -m mlc passes gpt2-small --batch 1 --seq 128
          python -m mlc run gpt-small --batch 1 --seq 32
